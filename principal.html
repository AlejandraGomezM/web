<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XYZ - Mercado Cambiario - Principal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(45deg, #1e3c72, #2a5298);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
            padding: 30px;
            min-height: 600px;
        }

        .section {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .section:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }

        .section h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 3px solid #3498db;
            padding-bottom: 10px;
        }

        .menu-operations {
            list-style: none;
        }

        .menu-operations li {
            margin-bottom: 15px;
        }

        .menu-operations a {
            display: block;
            padding: 15px 20px;
            background: linear-gradient(45deg, #3498db, #2980b9);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .menu-operations a:hover {
            background: linear-gradient(45deg, #2980b9, #1f5f8b);
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }

        .currency-images {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }

        .currency-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .currency-icon:hover {
            transform: scale(1.1);
        }

        .dollar-icon {
            background: linear-gradient(45deg, #27ae60, #2ecc71);
        }

        .euro-icon {
            background: linear-gradient(45deg, #e74c3c, #c0392b);
        }

        @media (max-width: 768px) {
            .main-content {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏛 XYZ - Mercado Cambiario</h1>
            <p>COMPRA Y VENTA DE MONEDA EXTRANJERA</p>
        </div>

        <div class="main-content">
            <!-- Sección Menú de Operaciones -->
            <div class="section">
                <h2>📋 Menú de Operaciones</h2>
                <ul class="menu-operations">
                    <li><a href="indicadores.html">1. Consultar Indicadores Económicos</a></li>
                    <li><a href="tasas.html">2. Consultar Tasas de Compra/Venta</a></li>
                    <li><a href="compramoneda.html">3. Comprar Moneda Extranjera</a></li>
                    <li><a href="#" onclick="alert('Funcionalidad próximamente disponible'); return false;">4. Vender Moneda Extranjera</a></li>
                </ul>

                <div class="currency-images">
                    <div class="currency-icon dollar-icon">
                        <div style="font-size: 24px;">💵</div>
                        <div>Dólar</div>
                    </div>
                    <div class="currency-icon euro-icon">
                        <div style="font-size: 24px;">💶</div>
                        <div>Euro</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
